name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{&0_0v_5xo9e7qr5h6-l^r6kj_##o)@ad(gyk%$ou&2rz7017o2}}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django Configuration
        run: python manage.py check

      - name: Run Migrations
        run: python manage.py migrate

      - name: Run Tests
        run: python manage.py test tasks
